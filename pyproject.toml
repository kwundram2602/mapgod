[project]
name = "mapgod"
version = "0.1.0"
description = "Vector + Raster maps, made simple"
requires-python = ">=3.13"
dependencies = [
    "geopandas",
    "rasterio",
    "matplotlib",
    "contextily",
    "leafmap",
    "folium",
    "numpy",
    "xarray>=2026.4.0",
    "rioxarray>=0.22.0",
    "vecraspy",
    "pillow>=12.2.0",
]

[project.scripts]
install-local = "mapgod.tools.install_local:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapgod"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv.sources]
vecraspy = { path = "../vecraspy", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.32",
]
